# Configuration Vonage (Nexmo) pour l'envoi de SMS
# Vonage supporte l'envoi de SMS vers la Tunisie ✅
# Pour obtenir ces informations :
# 1. Créez un compte sur https://dashboard.nexmo.com/sign-up
# 2. Allez dans Dashboard
# 3. Copiez votre API Key et API Secret
# 4. Vous avez 2€ de crédit gratuit pour tester

# API Key (ex: a1b2c3d4)
vonage.api.key=e4d746dc

# API Secret (ex: AbCdEfGh12345678)
vonage.api.secret=mWbwuncUR2ZZ9sx7

# Nom de l'expéditeur (max 11 caractères, pas d'espaces)
# Exemple : VitaPlus, Clinique, DrAhmed
vonage.from.name=VitaPlus

# Activer/Désactiver l'envoi de SMS (true/false)
# Mettez false pour tester sans envoyer de vrais SMS
vonage.enabled=true
