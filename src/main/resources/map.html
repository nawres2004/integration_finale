<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>VitaPlus Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  #map { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="map"></div>

<script>
  // Initialiser la carte Leaflet centrée sur Tunis
  var map = L.map('map').setView([36.8065, 10.1815], 12);

  // Tuiles OpenStreetMap (gratuit, pas de token requis)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  var patientMarker = null;
  var doctorMarkers = [];

  // ── Icônes personnalisées ──
  var patientIcon = L.divIcon({
    html: '<div style="background:#0066CC;width:36px;height:36px;border-radius:50%;' +
          'border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);' +
          'display:flex;align-items:center;justify-content:center;font-size:18px;">👤</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    className: ''
  });

  var doctorIcon = L.divIcon({
    html: '<div style="background:#22C55E;width:36px;height:36px;border-radius:50%;' +
          'border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);' +
          'display:flex;align-items:center;justify-content:center;font-size:18px;">🩺</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    className: ''
  });

  // ── Afficher le patient / médecin (marqueur bleu) ──
  function showPatient(lat, lon, name) {
    if (patientMarker) map.removeLayer(patientMarker);
    patientMarker = L.marker([lat, lon], { icon: patientIcon })
      .addTo(map)
      .bindPopup('<b>📍 ' + name + '</b>')
      .openPopup();
    map.setView([lat, lon], 14);
  }

  // ── Ajouter un médecin (marqueur vert) ──
  function addDoctor(lat, lon, name, specialite, distance) {
    var marker = L.marker([lat, lon], { icon: doctorIcon })
      .addTo(map)
      .bindPopup(
        '<b>Dr. ' + name + '</b><br>' +
        '<span style="color:#64748B">' + (specialite || 'Généraliste') + '</span><br>' +
        '<span style="color:#0066CC;font-weight:bold">📏 ' + distance + '</span>'
      );
    doctorMarkers.push(marker);
  }

  // ── Effacer les médecins ──
  function clearDoctors() {
    doctorMarkers.forEach(function(m) { map.removeLayer(m); });
    doctorMarkers = [];
  }

  // ── Ajuster la vue pour voir tous les marqueurs ──
  function fitAllMarkers() {
    var group = [];
    if (patientMarker) group.push(patientMarker.getLatLng());
    doctorMarkers.forEach(function(m) { group.push(m.getLatLng()); });
    if (group.length > 0) {
      map.fitBounds(L.latLngBounds(group), { padding: [50, 50], maxZoom: 14 });
    }
  }

  // ── Clic sur la carte → envoie coords à Java ──
  map.on('click', function(e) {
    var lat = e.latlng.lat.toFixed(6);
    var lon = e.latlng.lng.toFixed(6);
    if (window.javaConnector) {
      window.javaConnector.onMapClick(lat, lon);
    }
  });
</script>
</body>
</html>
